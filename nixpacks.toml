# Configuration for Nixpacks on Railway
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.pdo_sqlite", "php83Extensions.mbstring", "php83Extensions.curl"]

[phases.install]
cmds = [
  "if [ -d backend ]; then cd backend && composer install --no-dev --optimize-autoloader --no-interaction; else composer install --no-dev --optimize-autoloader --no-interaction; fi"
]

[phases.build]
cmds = ["echo 'Backend build complete'"]

[start]
cmd = "if [ -d backend ]; then cd backend; fi && mkdir -p database && touch database/database.sqlite && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
