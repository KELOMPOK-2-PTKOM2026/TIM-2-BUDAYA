<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMusik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d28" />
      <stop offset="50%" stop-color="#212838" />
      <stop offset="100%" stop-color="#12151f" />
    </linearGradient>
    <linearGradient id="circleGradMusik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3b59" />
      <stop offset="100%" stop-color="#161e30" />
    </linearGradient>
    <pattern id="gridPatternMusik" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#2d3a52" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="20" cy="20" r="1.5" fill="#7ba3e8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradMusik)" />
  <rect width="800" height="500" fill="url(#gridPatternMusik)" />

  <!-- Outer frame border with corner accents -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#374866" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />
  <rect x="32" y="32" width="736" height="436" rx="12" fill="none" stroke="#7ba3e8" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner embellishments -->
  <path d="M 44 60 L 44 44 L 60 44" fill="none" stroke="#7ba3e8" stroke-width="2.5" />
  <path d="M 756 60 L 756 44 L 740 44" fill="none" stroke="#7ba3e8" stroke-width="2.5" />
  <path d="M 44 440 L 44 456 L 60 456" fill="none" stroke="#7ba3e8" stroke-width="2.5" />
  <path d="M 756 440 L 756 456 L 740 456" fill="none" stroke="#7ba3e8" stroke-width="2.5" />

  <!-- Central Badge Circle -->
  <circle cx="400" cy="180" r="62" fill="url(#circleGradMusik)" stroke="#4a6394" stroke-width="2" />
  <circle cx="400" cy="180" r="68" fill="none" stroke="#7ba3e8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />

  <!-- Music / Instrument Icon (Traditional Gong & Strings) -->
  <g transform="translate(400, 180)" stroke="#a6c5f7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Traditional Gong outline -->
    <circle cx="0" cy="0" r="32" fill="#1b253b" fill-opacity="0.8" />
    <circle cx="0" cy="0" r="22" stroke="#7ba3e8" stroke-dasharray="4,3" />
    <!-- Gong boss (pencu) -->
    <circle cx="0" cy="0" r="9" fill="#a6c5f7" stroke="#ffffff" stroke-width="1.5" />
    <!-- Mallet / Tabuh stick -->
    <line x1="-34" y1="-28" x2="-14" y2="-10" stroke="#f6c368" stroke-width="3" />
    <circle cx="-34" cy="-28" r="6" fill="#f6c368" />
    <!-- Floating traditional melody notes -->
    <path d="M 28 -28 L 36 -34 L 36 -18 M 28 -28 L 28 -14" stroke="#7ba3e8" stroke-width="2" />
    <circle cx="26" cy="-14" r="3.5" fill="#7ba3e8" />
    <circle cx="34" cy="-18" r="3.5" fill="#7ba3e8" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 280)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#202c45" stroke="#3b527d" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#bcd5fd" letter-spacing="1.5">DOKUMENTASI MUSIK &amp; ALAT</text>
  </g>

  <!-- Title & Status -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#fdfcf8" letter-spacing="0.5">
    Foto Belum Tersedia
  </text>
  <text x="400" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9eafc7">
    Gambar Dummy Sementara • Dalam Proses Kurasi Lapangan
  </text>

  <!-- Footer Branding -->
  <line x1="320" y1="404" x2="480" y2="404" stroke="#374866" stroke-width="1" />
  <text x="400" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6d83a3" letter-spacing="2">
    JELAJAH SUMATERA • SENI MUSIK ADAT
  </text>
</svg>
