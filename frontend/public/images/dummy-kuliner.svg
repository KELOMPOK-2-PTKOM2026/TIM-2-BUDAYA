<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKuliner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211d17" />
      <stop offset="50%" stop-color="#2a221b" />
      <stop offset="100%" stop-color="#181410" />
    </linearGradient>
    <linearGradient id="circleGradKuliner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d321d" />
      <stop offset="100%" stop-color="#2b1a0d" />
    </linearGradient>
    <pattern id="gridPatternKuliner" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#4a3726" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="20" cy="20" r="1.5" fill="#d97736" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradKuliner)" />
  <rect width="800" height="500" fill="url(#gridPatternKuliner)" />

  <!-- Outer frame border with corner accents -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#523924" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />
  <rect x="32" y="32" width="736" height="436" rx="12" fill="none" stroke="#d97736" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner embellishments -->
  <path d="M 44 60 L 44 44 L 60 44" fill="none" stroke="#d97736" stroke-width="2.5" />
  <path d="M 756 60 L 756 44 L 740 44" fill="none" stroke="#d97736" stroke-width="2.5" />
  <path d="M 44 440 L 44 456 L 60 456" fill="none" stroke="#d97736" stroke-width="2.5" />
  <path d="M 756 440 L 756 456 L 740 456" fill="none" stroke="#d97736" stroke-width="2.5" />

  <!-- Central Badge Circle -->
  <circle cx="400" cy="180" r="62" fill="url(#circleGradKuliner)" stroke="#7d4b26" stroke-width="2" />
  <circle cx="400" cy="180" r="68" fill="none" stroke="#d97736" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />

  <!-- Food / Culinary Icon -->
  <g transform="translate(400, 180)" stroke="#f3a466" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam waves -->
    <path d="M -16 -44 C -20 -36 -12 -30 -16 -22" stroke="#e09055" stroke-dasharray="3,3" />
    <path d="M 0 -50 C -4 -40 4 -32 0 -22" stroke="#f3a466" />
    <path d="M 16 -44 C 12 -36 20 -30 16 -22" stroke="#e09055" stroke-dasharray="3,3" />
    <!-- Cloche dome / serving bowl -->
    <path d="M -36 4 C -36 -20 36 -20 36 4 Z" fill="#3b2212" fill-opacity="0.7" />
    <circle cx="0" cy="-22" r="4.5" fill="#f3a466" />
    <!-- Platter base -->
    <line x1="-46" y1="8" x2="46" y2="8" stroke-width="3" />
    <path d="M -38 12 L -28 26 L 28 26 L 38 12 Z" fill="#2b180d" fill-opacity="0.8" />
    <!-- Fork & Spoon accents on side -->
    <path d="M -30 36 L -20 28" stroke="#d97736" stroke-width="1.8" />
    <path d="M 30 36 L 20 28" stroke="#d97736" stroke-width="1.8" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 280)">
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#3d2616" stroke="#6e4020" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8b88b" letter-spacing="1.5">DOKUMENTASI KULINER</text>
  </g>

  <!-- Title & Status -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#fdfcf8" letter-spacing="0.5">
    Foto Belum Tersedia
  </text>
  <text x="400" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#bfa593">
    Gambar Dummy Sementara • Dalam Proses Kurasi Lapangan
  </text>

  <!-- Footer Branding -->
  <line x1="320" y1="404" x2="480" y2="404" stroke="#523924" stroke-width="1" />
  <text x="400" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8c705d" letter-spacing="2">
    JELAJAH SUMATERA • WARISAN KULINER
  </text>
</svg>
