<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBudaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14211d" />
      <stop offset="50%" stop-color="#1a2d28" />
      <stop offset="100%" stop-color="#0f1916" />
    </linearGradient>
    <linearGradient id="circleGradBudaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4c40" />
      <stop offset="100%" stop-color="#102e26" />
    </linearGradient>
    <pattern id="gridPatternBudaya" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#254a3f" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="20" cy="20" r="1.5" fill="#c89b3c" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradBudaya)" />
  <rect width="800" height="500" fill="url(#gridPatternBudaya)" />

  <!-- Outer frame border with corner accents -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#28564a" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />
  <rect x="32" y="32" width="736" height="436" rx="12" fill="none" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner embellishments -->
  <path d="M 44 60 L 44 44 L 60 44" fill="none" stroke="#c89b3c" stroke-width="2.5" />
  <path d="M 756 60 L 756 44 L 740 44" fill="none" stroke="#c89b3c" stroke-width="2.5" />
  <path d="M 44 440 L 44 456 L 60 456" fill="none" stroke="#c89b3c" stroke-width="2.5" />
  <path d="M 756 440 L 756 456 L 740 456" fill="none" stroke="#c89b3c" stroke-width="2.5" />

  <!-- Central Badge Circle -->
  <circle cx="400" cy="180" r="62" fill="url(#circleGradBudaya)" stroke="#357766" stroke-width="2" />
  <circle cx="400" cy="180" r="68" fill="none" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />

  <!-- General Cultural Heritage / Museum Monument Icon -->
  <g transform="translate(400, 180)" stroke="#e4c379" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pediment Roof (Traditional curved roof / temple) -->
    <path d="M -36 -12 Q 0 -36 36 -12" stroke-width="2.8" stroke="#f6deb0" />
    <path d="M -30 -12 L 0 -30 L 30 -12 Z" fill="#1b4137" fill-opacity="0.8" />
    <!-- Peak ornament -->
    <path d="M 0 -30 L 0 -44" stroke="#c89b3c" stroke-width="2.2" />
    <circle cx="0" cy="-46" r="3.5" fill="#f6deb0" />
    <!-- Columns -->
    <line x1="-24" y1="-8" x2="-24" y2="20" stroke-width="2.4" />
    <line x1="-8" y1="-8" x2="-8" y2="20" stroke-width="2.4" />
    <line x1="8" y1="-8" x2="8" y2="20" stroke-width="2.4" />
    <line x1="24" y1="-8" x2="24" y2="20" stroke-width="2.4" />
    <!-- Base podium -->
    <rect x="-34" y="20" width="68" height="8" rx="2" fill="#14362e" stroke-width="2" />
    <line x1="-42" y1="30" x2="42" y2="30" stroke-width="3" stroke="#c89b3c" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 280)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#1b4137" stroke="#2d6a5a" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a4ecd8" letter-spacing="1.5">ARSIP DOKUMENTASI BUDAYA</text>
  </g>

  <!-- Title & Status -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#fdfcf8" letter-spacing="0.5">
    Foto Belum Tersedia
  </text>
  <text x="400" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9bb3ac">
    Gambar Dummy Sementara • Dalam Proses Kurasi Lapangan
  </text>

  <!-- Footer Branding -->
  <line x1="320" y1="404" x2="480" y2="404" stroke="#28564a" stroke-width="1" />
  <text x="400" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#60847b" letter-spacing="2">
    JELAJAH SUMATERA • PUSTAKA DIGITAL NUSANTARA
  </text>
</svg>
