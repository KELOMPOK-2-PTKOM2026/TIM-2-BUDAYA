<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradUpacara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261a22" />
      <stop offset="50%" stop-color="#331e2b" />
      <stop offset="100%" stop-color="#1c1218" />
    </linearGradient>
    <linearGradient id="circleGradUpacara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542442" />
      <stop offset="100%" stop-color="#2e1123" />
    </linearGradient>
    <pattern id="gridPatternUpacara" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#522f46" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="20" cy="20" r="1.5" fill="#e891bd" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradUpacara)" />
  <rect width="800" height="500" fill="url(#gridPatternUpacara)" />

  <!-- Outer frame border with corner accents -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#633151" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />
  <rect x="32" y="32" width="736" height="436" rx="12" fill="none" stroke="#e891bd" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner embellishments -->
  <path d="M 44 60 L 44 44 L 60 44" fill="none" stroke="#e891bd" stroke-width="2.5" />
  <path d="M 756 60 L 756 44 L 740 44" fill="none" stroke="#e891bd" stroke-width="2.5" />
  <path d="M 44 440 L 44 456 L 60 456" fill="none" stroke="#e891bd" stroke-width="2.5" />
  <path d="M 756 440 L 756 456 L 740 456" fill="none" stroke="#e891bd" stroke-width="2.5" />

  <!-- Central Badge Circle -->
  <circle cx="400" cy="180" r="62" fill="url(#circleGradUpacara)" stroke="#8c396c" stroke-width="2" />
  <circle cx="400" cy="180" r="68" fill="none" stroke="#e891bd" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />

  <!-- Ceremony / Ritual Icon (Ceremonial Censer, Sacred Flames, Tepak) -->
  <g transform="translate(400, 180)" stroke="#f7b7d7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sacred Flame / Offering Aura -->
    <path d="M 0 -52 C -12 -38 0 -26 0 -16 C 0 -26 12 -38 0 -52 Z" fill="#f7b7d7" fill-opacity="0.6" />
    <path d="M 0 -40 C -6 -32 0 -24 0 -18 C 0 -24 6 -32 0 -40 Z" fill="#ffffff" />
    <!-- Ceremonial Urn / Pedestal -->
    <path d="M -24 0 L -32 14 L 32 14 L 24 0 Z" fill="#421a33" fill-opacity="0.8" />
    <line x1="-38" y1="14" x2="38" y2="14" stroke-width="2.8" />
    <!-- Pedestal base -->
    <path d="M -16 16 L -20 34 L 20 34 L 16 16 Z" fill="#2d1022" />
    <line x1="-28" y1="36" x2="28" y2="36" stroke-width="3" stroke="#e891bd" />
    <!-- Incense / Sacred smoke lines -->
    <path d="M -22 -24 C -28 -34 -18 -42 -24 -50" stroke="#d479a8" stroke-dasharray="2,3" />
    <path d="M 22 -24 C 28 -34 18 -42 24 -50" stroke="#d479a8" stroke-dasharray="2,3" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 280)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#451e36" stroke="#75355d" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbcfe4" letter-spacing="1.5">DOKUMENTASI UPACARA ADAT</text>
  </g>

  <!-- Title & Status -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#fdfcf8" letter-spacing="0.5">
    Foto Belum Tersedia
  </text>
  <text x="400" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#c4a5b7">
    Gambar Dummy Sementara • Dalam Proses Kurasi Lapangan
  </text>

  <!-- Footer Branding -->
  <line x1="320" y1="404" x2="480" y2="404" stroke="#633151" stroke-width="1" />
  <text x="400" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#966d86" letter-spacing="2">
    JELAJAH SUMATERA • RITUAL &amp; UPACARA
  </text>
</svg>
